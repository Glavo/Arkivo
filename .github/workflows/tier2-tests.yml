name: Tier 2 tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/tier2-tests.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "buildSrc/**"
      - "gradle/wrapper/**"
      - "gradle/test-data/**"
      - "arkivo-all/**"
      - "arkivo-archive/**"
      - "arkivo-archive-all/**"
      - "arkivo-archive-codec/**"
      - "arkivo-archive-7z/**"
      - "arkivo-archive-ar/**"
      - "arkivo-archive-cpio/**"
      - "arkivo-archive-dmg/**"
      - "arkivo-archive-rar/**"
      - "arkivo-archive-tar/**"
      - "arkivo-archive-zip/**"
      - "arkivo-base/**"
      - "arkivo-encoding-detector/**"
      - "arkivo-checksum/**"
      - "arkivo-checksum-xxhash/**"
      - "arkivo-codec/**"
      - "arkivo-codec-all/**"
      - "arkivo-codec-bzip2/**"
      - "arkivo-codec-compress/**"
      - "arkivo-codec-deflate/**"
      - "arkivo-codec-lz4/**"
      - "arkivo-codec-lzma/**"
      - "arkivo-codec-lzip/**"
      - "arkivo-codec-ppmd/**"
      - "arkivo-codec-xz/**"
      - "arkivo-codec-zstd/**"

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

concurrency:
  group: tier2-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compatibility and upstream corpora / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Tier 2 tests
        run: ./gradlew tier2Test --no-daemon --stacktrace

  reference-interop:
    name: Required compression and archive references
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install reference toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libc6-dev llvm nodejs tar
          echo "ARKIVO_NODE_EXECUTABLE=$(command -v node)" >> "$GITHUB_ENV"
          echo "ARKIVO_LLVM_AR_EXECUTABLE=$(command -v llvm-ar)" >> "$GITHUB_ENV"
          echo "ARKIVO_GNU_TAR_EXECUTABLE=$(command -v tar)" >> "$GITHUB_ENV"
          node --version
          llvm-ar --version
          tar --version
          gcc --version

      - name: Build verified sources and require reference tests
        env:
          ARKIVO_REFERENCE_C_COMPILER: gcc
          ARKIVO_NCOMPRESS_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-compress/build/reference-tools/ncompress-reference
          ARKIVO_REQUIRE_NCOMPRESS: "true"
          ARKIVO_ZOPFLI_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-deflate/build/reference-tools/zopfli
          ARKIVO_REQUIRE_ZOPFLI: "true"
          ARKIVO_LZ4_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-lz4/build/reference-tools/lz4
          ARKIVO_REQUIRE_LZ4: "true"
          ARKIVO_REQUIRE_NODE: "true"
          ARKIVO_REQUIRE_LLVM_AR: "true"
          ARKIVO_REQUIRE_GNU_TAR: "true"
        run: >-
          ./gradlew
          :arkivo-codec-compress:buildNcompressReference
          :arkivo-codec-deflate:buildZopfliReference
          :arkivo-codec-lz4:buildLZ4Reference
          :arkivo-codec-compress:tier2Test
          :arkivo-codec-deflate:tier2Test
          :arkivo-codec-lz4:tier2Test
          :arkivo-archive-ar:tier2Test
          :arkivo-archive-tar:tier2Test
          --no-daemon --continue --stacktrace

  zstd-reference:
    name: Required official Zstandard references
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build references and verify Zstandard interoperability
        env:
          ARKIVO_ZSTD_C_COMPILER: gcc
          ARKIVO_ZSTD_DECODECORPUS_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/decodecorpus
          ARKIVO_REQUIRE_ZSTD_DECODECORPUS: "true"
          ARKIVO_ZSTD_FSE_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-fse-reference
          ARKIVO_REQUIRE_ZSTD_FSE: "true"
          ARKIVO_ZSTD_HUFFMAN_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-huffman-reference
          ARKIVO_REQUIRE_ZSTD_HUFFMAN: "true"
          ARKIVO_ZSTD_BLOCK_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-block-reference
          ARKIVO_REQUIRE_ZSTD_BLOCK: "true"
          ARKIVO_ZSTD_PREFIX_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-prefix-reference
          ARKIVO_REQUIRE_ZSTD_PREFIX: "true"
          ARKIVO_ZSTD_ROUND_TRIP_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-round-trip-reference
          ARKIVO_REQUIRE_ZSTD_ROUND_TRIP: "true"
          ARKIVO_ZSTD_STREAM_ROUND_TRIP_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-stream-round-trip-reference
          ARKIVO_REQUIRE_ZSTD_STREAM_ROUND_TRIP: "true"
          ARKIVO_ZSTD_DICTIONARY_STREAM_ROUND_TRIP_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-dictionary-stream-round-trip-reference
          ARKIVO_REQUIRE_ZSTD_DICTIONARY_STREAM_ROUND_TRIP: "true"
          ARKIVO_ZSTD_SEEKABLE_ROUND_TRIP_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-seekable-round-trip-reference
          ARKIVO_REQUIRE_ZSTD_SEEKABLE_ROUND_TRIP: "true"
          ARKIVO_ZSTD_DICTIONARY_LOADER_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-dictionary-loader-reference
          ARKIVO_REQUIRE_ZSTD_DICTIONARY_LOADER: "true"
          ARKIVO_ZSTD_RAW_DICTIONARY_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-raw-dictionary-reference
          ARKIVO_REQUIRE_ZSTD_RAW_DICTIONARY: "true"
          ARKIVO_ZSTD_DICTIONARY_ROUND_TRIP_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-dictionary-round-trip-reference
          ARKIVO_REQUIRE_ZSTD_DICTIONARY_ROUND_TRIP: "true"
          ARKIVO_ZSTD_DICTIONARY_DECOMPRESS_EXECUTABLE: ${{ github.workspace }}/arkivo-codec-zstd/build/reference-tools/zstd-dictionary-decompress-reference
          ARKIVO_REQUIRE_ZSTD_DICTIONARY_DECOMPRESS: "true"
        run: ./gradlew :arkivo-codec-zstd:buildZstdDecodeCorpus :arkivo-codec-zstd:buildZstdFseReference :arkivo-codec-zstd:buildZstdHuffmanReference :arkivo-codec-zstd:buildZstdBlockReference :arkivo-codec-zstd:buildZstdPrefixReference :arkivo-codec-zstd:buildZstdRoundTripReference :arkivo-codec-zstd:buildZstdStreamRoundTripReference :arkivo-codec-zstd:buildZstdDictionaryStreamRoundTripReference :arkivo-codec-zstd:buildZstdSeekableRoundTripReference :arkivo-codec-zstd:buildZstdDictionaryLoaderReference :arkivo-codec-zstd:buildZstdRawDictionaryReference :arkivo-codec-zstd:buildZstdDictionaryRoundTripReference :arkivo-codec-zstd:buildZstdDictionaryDecompressReference :arkivo-codec-zstd:tier2Test --no-daemon --stacktrace

  sevenzip-interop:
    name: Required official 7-Zip interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install official 7-Zip
        run: |
          directory="$RUNNER_TEMP/7zip-26.04"
          archive="$RUNNER_TEMP/7z2604-linux-x64.tar.xz"
          mkdir -p "$directory"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/ip7z/7zip/releases/download/26.04/7z2604-linux-x64.tar.xz
          echo "fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$directory" 7zz
          executable="$directory/7zz"
          test -x "$executable"
          echo "ARKIVO_7Z_EXECUTABLE=$executable" >> "$GITHUB_ENV"
          "$executable" i

      - name: Verify encrypted BCJ2 archives
        env:
          ARKIVO_REQUIRE_7Z: "true"
        run: ./gradlew :arkivo-archive-7z:tier2Test --tests '*SevenZipOfficialCliInteropTest' --no-daemon --stacktrace
